apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/type: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/type: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/type: backend
    spec:
      imagePullSecrets:
        - name: {{ .Values.pullsecretname }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          
          env:

            - name: DJANGO_THESES_DEBUG
              value: "{{ .Values.env.DJANGO_THESES_DEBUG }}"

            - name: DJANGO_ALLOWED_HOSTS
              value: "{{ .Values.env.DJANGO_ALLOWED_HOSTS }}"

            - name: TESSERACT_CMD
              value: "{{ .Values.env.TESSERACT_CMD }}"

            - name: POPPLER_PATH
              value: "{{ .Values.env.POPPLER_PATH }}" 

            - name: DJANGO_THESES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DJANGO_THESES_KEY

            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: GROQ_API_KEY

           

          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
              memory: "{{ .Values.resources.limits.memory }}"