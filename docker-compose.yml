version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: trialpilot_web
    ports:
      - "8000:8000"
    environment:
      DJANGO_THESES_KEY: ${DJANGO_THESES_KEY}
      DJANGO_THESES_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      GROQ_API_KEY: ${GROQ_API_KEY}
      TESSERACT_CMD: "tesseract"
      POPPLER_PATH: ""
    volumes:
      - .:/app