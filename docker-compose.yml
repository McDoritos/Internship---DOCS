version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: trialpilot_web
    ports:
      - "8000:8000"
    environment:
      DJANGO_THESES_KEY: dev-secret
      DJANGO_THESES_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      TESSERACT_CMD: "tesseract"
      POPPLER_PATH: ""
    volumes:
      - .:/app