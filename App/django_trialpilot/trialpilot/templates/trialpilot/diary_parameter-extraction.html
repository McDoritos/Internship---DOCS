<h1 class="mb-4">Diary Parameter Extraction</h1>

<div class="mb-4">
    <h3>Diary contents:</h3>
    <p class="border p-3 bg-light">{{ diary }}</p>
</div>

<h3>Extracted Parameters:</h3>

<form method="POST" class="mt-3">
    {% csrf_token %}

    <ul class="list-group mb-3">
        {% for key, value in extracted_params.items %}
            <li class="list-group-item">
                <label class="form-label"><strong>{{ key }}:</strong></label>
                <input type="text" name="{{ key }}" value="{{ value }}" class="form-control">
            </li>
        {% endfor %}
    </ul>

    <button type="submit" class="btn btn-success">Confirm and Save</button>
</form>
