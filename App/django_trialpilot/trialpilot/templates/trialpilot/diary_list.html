<h1 class="mb-4">Clinical Diary List</h1>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mb-3">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<ul class="list-group">
    {% for diary in diaries %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ diary }}

            <a href="{% url 'parameter_extraction' diary.id %}" class="btn btn-primary btn-sm">
                Extract Parameters
            </a>
        </li>
    {% endfor %}
</ul>
