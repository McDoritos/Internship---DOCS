{% extends "trialpilot/base.html" %}

{% block title %}Clinical Trial Patient Matching{% endblock %}

{% block content %}

    <!-- HEADER -->
    <div class="mb-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h2 class="fw-bold mb-1">Clinical Trial Patient Matching</h2>
                <p class="text-muted mb-0">
                    Review and validate the matched patients before saving this information.
                </p>
            </div>

            <div class="trial-badge px-3 py-2 rounded-pill">
                <i class="bi bi-journal-medical me-2"></i>
                {{ trial.title }}
            </div>
        </div>
        <hr class="mt-4">
    </div>

{% endblock %}
