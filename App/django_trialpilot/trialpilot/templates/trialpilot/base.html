{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>

    <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet">
</head>
<body>

    <header>
        <h1>My Website</h1>
        {% block header %}{% endblock %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% block footer %}{% endblock %}
    </footer>

</body>
</html>
