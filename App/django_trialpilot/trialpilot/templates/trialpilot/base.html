{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>

    <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>

</head>

<body>

    <div class="sidebar p-3 sidebar-border d-flex flex-column">
        <header>
            <h1 style="text-align: center;">TrialPilot</h1>
            {% block header %}{% endblock %}
        </header>

        <div class="sidebar-divider ml-3 mr-3"></div>

        <ul class="nav flex-column my-auto">
            <li class="nav-item"><a class="nav-link"><b>CLINICAL TRIALS</b></a></li>
            <div class="sidebar-divider ml-3 mr-3"></div>

            <li class="nav-item"><a class="nav-link"><b>CLINICAL DIARIES</b></a></li>
            <div class="sidebar-divider ml-3 mr-3"></div>

            <li class="nav-item"><a class="nav-link"><b>PATIENTS</b></a></li>
        </ul>

        {% block sidebar %}{% endblock %}
    </div>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% block footer %}{% endblock %}
    </footer>

</body>

</html>
